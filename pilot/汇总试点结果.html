<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>千万间 Roomillion 试点结果汇总</title>
  <style>:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#193b31;background:#edf4f0}*{box-sizing:border-box}body{margin:0;padding:32px}.page{max-width:940px;margin:auto}.card{background:#fff;border:1px solid #d5e3dc;border-radius:18px;padding:24px;margin-bottom:16px}h1{margin-top:0}input{display:block;margin:14px 0}button{border:0;border-radius:9px;padding:11px 16px;background:#167556;color:#fff;font-weight:800;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;border-bottom:1px solid #e4ece8;padding:10px}.pass{color:#14704f;font-weight:800}.fail{color:#b04b36;font-weight:800}.muted{color:#6b7e76}pre{white-space:pre-wrap;background:#f4f7f5;padding:12px;border-radius:10px}</style>
</head>
<body><main class="page"><section class="card"><h1>试点结果汇总</h1><p>选择 5～20 份由“试点反馈表”导出的 JSON。所有计算都在当前浏览器本地完成。</p><input id="files" type="file" accept="application/json,.json" multiple><button id="export" disabled>导出汇总 JSON</button><p id="status" class="muted">尚未选择文件。</p></section><section class="card"><h2>指标</h2><table><thead><tr><th>指标</th><th>通过/样本</th><th>结果</th><th>阶段目标</th></tr></thead><tbody id="metrics"></tbody></table></section><section class="card"><h2>文件问题</h2><pre id="errors">无</pre></section></main><script src="./pilot-feedback-core.js"></script><script>
  const labels={firstLaunch:['首次启动成功率','≥95%'],exampleInstall:['示例安装成功率','≥90%'],backupRestore:['备份恢复成功率','≥95%'],checkpointRestore:['程序回退成功率','≥95%'],failedModificationRecovery:['失败修改恢复率','100%'],permissionConfusion:['权限文案困惑率','<10%']};let current=null;
  const percent=(value)=>value===null?'无数据':(value*100).toFixed(1)+'%';
  document.getElementById('files').addEventListener('change',async(event)=>{const parsed=[];const readErrors=[];for(const file of event.target.files){try{parsed.push(JSON.parse(await file.text()))}catch(error){readErrors.push(file.name+': '+error.message)}}current=PilotFeedback.summarizeFeedback(parsed);const body=document.getElementById('metrics');body.replaceChildren();for(const [key,[label,target]] of Object.entries(labels)){const metric=current.metrics[key];const passed=current.targets[key].passed;const row=document.createElement('tr');for(const text of [label,(metric.passed??metric.matching)+' / '+metric.total,percent(metric.rate),target]){const cell=document.createElement('td');cell.textContent=text;row.append(cell)}row.children[2].className=passed?'pass':'fail';body.append(row)}document.getElementById('status').textContent='有效样本 '+current.sampleSize+' 份；阶段样本目标 '+(current.targets.sampleSize.passed?'已达到':'未达到')+'。';document.getElementById('status').className=current.targets.sampleSize.passed?'pass':'fail';const allErrors=[...readErrors,...current.errors.map(error=>'文件 '+(error.index+1)+': '+error.message)];document.getElementById('errors').textContent=allErrors.length?allErrors.join('\n'):'无';document.getElementById('export').disabled=false});
  document.getElementById('export').addEventListener('click',()=>{if(!current)return;const blob=new Blob([JSON.stringify(current,null,2)+'\n'],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='zhibian-pilot-summary.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)});
  </script></body></html>
