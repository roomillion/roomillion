<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作台助手</title><link rel="stylesheet" href="assistant.css"></head><body>
<header><h2>让房间为你工作</h2><div class="actions"><select id="session" aria-label="助手对话"></select><button disabled id="new">新对话</button></div><details><summary>模型与设置</summary><label>助手模型<select id="model"></select></label><label>思考强度<select id="thinking" title="仅目录声明支持的模型发送思考参数；跟随模型不覆盖模型默认行为"><option value="off">跟随模型</option><option value="low">简短思考</option><option value="medium">适中思考</option><option value="high">深入思考</option></select></label><label>连接重试<select id="retries"><option value="0">不重试</option><option value="2">2 次</option><option value="4">4 次</option></select></label><button id="export">导出对话</button><details><summary>房间助手访问</summary><div id="catalog"></div></details></details><nav class="actions"><button id="chatTab">对话</button><button id="taskTab">执行记录与文件</button></nav></header>
<p id="status" role="status">正在恢复对话…</p><main id="chat"><div id="messages"></div></main><main id="tasks" hidden></main><footer><form id="form"><div id="files"></div><textarea id="prompt" rows="2" aria-label="告诉助手你的需求" placeholder="例如：登记 5 支铅笔，再把物资清单整理成 PDF"></textarea><div class="actions"><button disabled id="attach" type="button">添加文件</button><button disabled id="stop" type="button">停止对话</button><button disabled id="send" type="submit">发送</button></div></form></footer><script src="assistant.js"></script></body></html>
