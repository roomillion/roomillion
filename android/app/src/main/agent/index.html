<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="agent.css"><title>AI 修改房间</title></head><body>
<header><h2 id="name">AI 修改房间</h2><p>直接说明想改什么。草稿和对话自动保存，测试通过后更新房间。</p><label>编程模型<select id="model"></select></label><label>自动重试<select id="retries"><option value="2">2 次</option><option value="0">不重试</option><option value="4">4 次</option></select></label><div class="actions"><button id="test">测试草稿</button><button id="apply">应用更新</button><button id="rollback">恢复上一版</button><button id="export">导出对话</button></div></header>
<p id="status" role="status">正在恢复对话…</p><main id="messages"></main><footer><textarea id="prompt" rows="3" placeholder="例如：增加搜索功能；修复保存后列表没有更新的问题"></textarea><div class="actions"><button id="send">发送</button><button id="continue">继续</button><button id="stop">停止</button><button id="restart">新会话</button></div></footer><script src="agent.js"></script></body></html>
